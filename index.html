<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Globe</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231e5fa8'/><path d='M6 13c6-3 14 3 20-1M5 19c7 3 15-3 22 1' stroke='white' stroke-width='2' fill='none' opacity='.8'/></svg>" />
  </head>
  <body>
    <canvas id="globe"></canvas>

    <aside class="panel" id="panel">
      <header>
        <h1>Weather Globe</h1>
        <button class="icon-btn" id="collapse" aria-label="Collapse panel" title="Collapse">–</button>
      </header>
      <div class="panel-body">
        <section>
          <h2>Base layer</h2>
          <div id="sources" class="sources" role="radiogroup" aria-label="Base layer"></div>
          <label class="field" id="date-field" hidden>
            <span>Imagery date (UTC)</span>
            <input type="date" id="date" />
          </label>
          <label class="check" id="labels-field">
            <input type="checkbox" id="labels" />
            <span>Borders &amp; place names</span>
          </label>
        </section>
        <section>
          <h2>Weather layers</h2>
          <label class="check">
            <input type="checkbox" id="clouds" />
            <span>Current clouds</span>
          </label>
          <div id="cloud-opts" class="sub" hidden>
            <label class="field">
              <span>Height exaggeration <b id="exag-val">20×</b></span>
              <input type="range" id="exag" min="1" max="80" step="1" value="20" />
            </label>
            <label class="field">
              <span>Opacity <b id="dens-val">90%</b></span>
              <input type="range" id="dens" min="10" max="100" step="5" value="90" />
            </label>
            <p class="muted small" id="cloud-status">—</p>
            <div class="model-block">
              <span class="block-title">United States · HRRR + METAR</span>
              <label class="field" id="fc-field" hidden>
                <span>Forecast <b id="fc-val">Now</b></span>
                <input type="range" id="fc" min="0" max="12" step="1" value="0" />
              </label>
              <label class="check"><input type="checkbox" id="metar" checked /> <span>METAR stations</span></label>
              <label class="check"><input type="checkbox" id="trim" checked /> <span>Check model against satellite</span></label>
              <p class="muted small" id="model-status">—</p>
            </div>
          </div>
        </section>
        <details>
          <summary>Controls &amp; debug</summary>
          <ul class="help">
            <li><b>Drag</b> pan · <b>Scroll / pinch</b> zoom</li>
            <li><b>Right-drag</b> or <b>Shift-drag</b> rotate &amp; tilt</li>
            <li><b>Double-click</b> fly in</li>
          </ul>
          <div class="field">
            <span>Units</span>
            <div class="segmented" id="units" role="radiogroup" aria-label="Units">
              <button type="button" role="radio" data-units="metric">Metric</button>
              <button type="button" role="radio" data-units="imperial">Imperial</button>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="debug" /> <span>Show tile stats</span></label>
          <pre id="stats" hidden></pre>
        </details>
      </div>
    </aside>

    <div class="hud">
      <button class="compass" id="compass" title="Reset north &amp; tilt" aria-label="Reset north and tilt">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4l5 16h-10z" fill="#ff5a4f"/><path d="M20 36l-5-16h10z" fill="#c9d3dd"/></svg>
      </button>
      <button class="home" id="home" title="Whole globe" aria-label="Zoom out to whole globe">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <footer class="status">
      <span id="cursor">—</span>
      <span id="alt"></span>
      <span id="attribution" class="attribution"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
